AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Event-driven weekly meetings report pipeline: EventBridge Scheduler triggers
  an SQS queue (with DLQ) every Monday at 07:00 Europe/Kyiv. The Report Builder
  Lambda (in VPC) generates a weekly CSV report and uploads it to an encrypted S3
  bucket via an S3 Gateway VPC endpoint. The Mailer Lambda (outside VPC) is
  triggered by s3:ObjectCreated events on reports/*.csv, applies persistent
  DynamoDB email deduplication, and sends the report via Amazon SES.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of resources in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Aurora PostgreSQL and Report Builder reside.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private/default subnets for the Report Builder Lambda.

  FunctionSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the Report Builder (allowed to access Aurora on port 5432).

  RouteTableIds:
    Type: List<String>
    Description: Route table IDs to attach the S3 Gateway VPC endpoint to.

  ImageUri:
    Type: String
    Description: Container image URI (pinned by digest or latest tag) for Report Builder and Mailer.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL (e.g. postgresql+asyncpg://app:pwd@endpoint:5432/meetings).

  AppTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Application timezone for week boundary and metrics calculations.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  SenderEmail:
    Type: String
    Default: ""
    Description: Verified Amazon SES sender email address (e.g. reports@example.com).

  RecipientEmail:
    Type: String
    Default: ""
    Description: Recipient email address for weekly reports.

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

Resources:
  # --- S3 Gateway VPC Endpoint ------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- DynamoDB Deduplication Table -------------------------------------------
  DedupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-reports-dedup"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_key
          AttributeType: S
      KeySchema:
        - AttributeName: report_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- SQS Queues & Redrive Policy --------------------------------------------
  WeeklyReportDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-weekly-report-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklyReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-weekly-report-queue"
      # Report Builder timeout is 60s; visibility timeout must be >= 6 * 60s = 360s
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WeeklyReportDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklyReportQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WeeklyReportQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSchedulerSendMessage
            Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WeeklyReportQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*"

  # --- EventBridge Scheduler --------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToWeeklyQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WeeklyReportQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-schedule"
      Description: Triggers weekly meetings report every Monday at 07:00 Europe/Kyiv
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt WeeklyReportQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action":"weekly_report"}'

  # --- Report Builder Lambda (in VPC) -----------------------------------------
  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt WeeklyReportQueue.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*.csv"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Builds weekly meetings CSV report and uploads to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.builder.handler"
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ReportBuilderRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ReportBuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: !Ref AppTimezone
          LOG_LEVEL: !Ref LogLevel
          REPORTS_BUCKET_NAME: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt WeeklyReportQueue.Arn
      FunctionName: !Ref ReportBuilderFunction

  # --- Mailer Lambda (outside VPC) --------------------------------------------
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*.csv"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt DedupTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Delivers weekly reports via Amazon SES upon S3 ObjectCreated
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.mailer.handler"
      Architectures:
        - !Ref Architecture
      Role: !GetAtt MailerRole.Arn
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          APP_TIMEZONE: !Ref AppTimezone
          LOG_LEVEL: !Ref LogLevel
          REPORTS_BUCKET_NAME: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          REPORTS_SENDER_EMAIL: !Ref SenderEmail
          REPORTS_RECIPIENT_EMAIL: !Ref RecipientEmail
          REPORTS_DEDUP_TABLE: !Ref DedupTable
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- Encrypted S3 Reports Bucket with Notification --------------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerLambdaPermission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReportsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ReportsBucketName:
    Description: Private encrypted S3 bucket holding reports
    Value: !Ref ReportsBucket

  WeeklyReportQueueUrl:
    Description: SQS Queue URL for report trigger
    Value: !Ref WeeklyReportQueue

  WeeklyReportDLQUrl:
    Description: SQS Dead-Letter Queue URL
    Value: !Ref WeeklyReportDLQ

  ReportBuilderFunctionName:
    Description: Report Builder Lambda function name (in VPC)
    Value: !Ref ReportBuilderFunction

  MailerFunctionName:
    Description: Mailer Lambda function name (outside VPC)
    Value: !Ref MailerFunction

  DedupTableName:
    Description: DynamoDB table used for email deduplication
    Value: !Ref DedupTable

  ScheduleName:
    Description: EventBridge Scheduler schedule name
    Value: !Ref WeeklyReportSchedule
